name: Test VFSI public package integration

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ vfsi ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    name: Native macOS stat projection / ABI v3
    steps:
      - uses: actions/checkout@v7
      - name: Verify headers-only preparation
        run: python3 support/test-build-vfsi-c.py
      - name: Prepare the published SDK headers
        id: sdk
        run: support/build-vfsi-c --headers-only
      - name: Check native seconds and nanoseconds
        env:
          VFSI_INCLUDE: ${{ steps.sdk.outputs.include }}
        run: |
          test -f "$VFSI_INCLUDE/vfsi.h"
          python3 support/test-vfsi-cohorts.py StatProjection

  test:
    # The public native dependency builds pinned ntirpc source.
    runs-on: ubuntu-26.04
    name: Published VFSI SDK / C ABI v3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake clang cmake \
            libclang-dev libkrb5-dev \
            liburcu-dev make pkg-config
      - name: Verify SDK preparation
        run: python3 support/test-build-vfsi-c.py
      - name: Build VFSI from public crates
        id: sdk
        run: support/build-vfsi-c
      - name: Build rsync with VFSI
        env:
          VFSI_INCLUDE: ${{ steps.sdk.outputs.include }}
        run: |
          CPPFLAGS="-I$VFSI_INCLUDE" \
            ./configure --enable-vfsi --disable-md2man --disable-xxhash \
              --disable-zstd --disable-lz4 --disable-idn
          make -j2
      - name: Smoke test the public VFSI library
        env:
          VFSI_LIBRARY: ${{ steps.sdk.outputs.library }}
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/source" "$fixture/destination"
          printf 'vfsi public package smoke\n' >"$fixture/source/input"
          VFSI_VERBOSE=1 VFSI_IMPL=dummy \
          VFSI_ROOT="$fixture" \
          VFSI_MOUNT="$fixture" \
            ./rsync -a "$fixture/source/" "$fixture/destination/" >"$fixture/trace" 2>&1
          cat "$fixture/trace"
          grep -q 'vfsi: cached ' "$fixture/trace"
          cmp "$fixture/source/input" "$fixture/destination/input"
      - name: Verify incremental and non-incremental port parity
        env:
          VFSI_LIBRARY: ${{ steps.sdk.outputs.library }}
        run: sh support/test-vfsi-port.sh
